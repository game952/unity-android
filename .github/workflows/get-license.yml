# ① 获取 Unity 许可证 · v3（三源下载加固版）
# v2 在 GitHub 服务器上被 Unity CDN 拒绝（wget 退出码 8）。
# v3 改为：官方 apt 仓库 deb 包（主源）→ 全球 CDN AppImage（备源1）
#         → 中国镜像 CDN（备源2），依次回退。
# 领取方式不变：Unity Hub 官方包自带的 Unity.Licensing.Client
# 用账号密码直接领个人版许可证，全程云端，不需要打开任何网页。
name: ① 获取 Unity 许可证

on:
  workflow_dispatch:

jobs:
  get-license:
    name: 生成许可证文件
    runs-on: ubuntu-latest
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: 检查账号密码
        run: |
          if [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; then
            echo "::error::仓库里还没设置 UNITY_EMAIL / UNITY_PASSWORD 这两个 Secret（Settings → Secrets and variables → Actions），设好后重新运行本工作流"
            exit 1
          fi
          echo "Secret 已就绪，开始领取个人版许可证"

      - name: 下载 Unity 许可证客户端（三源回退）
        run: |
          CLIENT=""
          # ---- 源1：Unity 官方 apt 仓库的 deb 包（Artifactory 服务器）----
          PKG=$(curl -fsSL --retry 3 --max-time 60 \
            "https://hub.unity3d.com/linux/repos/deb/dists/stable/main/binary-amd64/Packages" \
            | grep "^Filename:" | tail -1 | awk '{print $2}' || true)
          echo "apt 仓库最新包：${PKG:-未取到}"
          if [ -n "$PKG" ] && curl -fsSL --retry 3 --max-time 600 \
               -o /tmp/hub.deb "https://hub.unity3d.com/linux/repos/deb/$PKG"; then
            rm -rf /tmp/hubdeb && mkdir -p /tmp/hubdeb
            if dpkg-deb -x /tmp/hub.deb /tmp/hubdeb 2>/dev/null; then
              CLIENT=$(find /tmp/hubdeb -name "Unity.Licensing.Client" -type f | head -n 1)
              [ -n "$CLIENT" ] && echo "源1（apt deb）成功"
            fi
          fi
          # ---- 源2：全球 CDN 的 AppImage ----
          if [ -z "$CLIENT" ]; then
            echo "::warning::源1失败，改试源2（全球 CDN AppImage）"
            if curl -fSL --retry 3 --max-time 600 -A "Mozilla/5.0" \
                 -o /tmp/hub.AppImage \
                 "https://public-cdn.cloud.unity3d.com/hub/prod/UnityHub.AppImage"; then
              chmod +x /tmp/hub.AppImage
              (cd /tmp && ./hub.AppImage --appimage-extract > /dev/null)
              [ -f /tmp/squashfs-root/UnityLicensingClient_V1/Unity.Licensing.Client ] \
                && CLIENT=/tmp/squashfs-root/UnityLicensingClient_V1/Unity.Licensing.Client \
                && echo "源2（全球 CDN）成功"
            fi
          fi
          # ---- 源3：中国镜像 CDN 的 AppImage ----
          if [ -z "$CLIENT" ]; then
            echo "::warning::源2失败，改试源3（中国镜像 CDN）"
            if curl -fSL --retry 3 --max-time 900 -A "Mozilla/5.0" \
                 -o /tmp/hub.AppImage \
                 "https://public-cdn.cloud.unitychina.cn/hub/prod/UnityHub.AppImage"; then
              chmod +x /tmp/hub.AppImage
              (cd /tmp && ./hub.AppImage --appimage-extract > /dev/null)
              [ -f /tmp/squashfs-root/UnityLicensingClient_V1/Unity.Licensing.Client ] \
                && CLIENT=/tmp/squashfs-root/UnityLicensingClient_V1/Unity.Licensing.Client \
                && echo "源3（中国镜像）成功"
            fi
          fi
          if [ -z "$CLIENT" ]; then
            echo "::error::三个下载源全部失败——把本步骤日志截图发给助手"
            exit 1
          fi
          chmod +x "$CLIENT"
          echo "拿到许可证客户端：$CLIENT"
          echo "CLIENT=$CLIENT" >> "$GITHUB_ENV"

      - name: 领取 Unity 个人版免费许可证
        run: |
          mkdir -p "$HOME/.local/share/unity3d/Unity/"
          "$CLIENT" --activate-all --include-personal \
            --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" || true
          echo "---- 当前账号拿到的许可证 ----"
          "$CLIENT" --showEntitlements || true

      - name: 收集许可证文件
        run: |
          ULF=$(find / \( -name "Unity_lic.ulf" -o -name "*.ulf" \) \
                -not -path "/proc/*" -not -path "/sys/*" 2>/dev/null | head -n 1)
          if [ -z "$ULF" ]; then
            echo "::error::没有生成许可证文件——把「领取」一步的日志展开截图发给助手（重点是有 error 字样的行）"
            exit 1
          fi
          echo "许可证已生成：$ULF"
          cp "$ULF" "$GITHUB_WORKSPACE/Unity-personal.ulf"
          ls -l "$GITHUB_WORKSPACE/Unity-personal.ulf"

      - name: 上传许可证文件
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-files
          path: Unity-personal.ulf
          if-no-files-found: error
